CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# CONFIG_NETWORKING selects ENTROPY_GENERATOR, which defaults on the RP2350
# hardware RNG driver (ENTROPY_RPI_PICO_RNG). That driver pulls in hal_rpi_pico's
# pico_rand module, whose .uninitialized_data.rng_state section lands inside the
# RAM data-copy region immediately before usbd_context_area, desyncing the
# flash->RAM copy and corrupting the CDC ACM USBD context. Disable it and rely
# on the TEST_RANDOM_GENERATOR fallback instead.
CONFIG_ENTROPY_RPI_PICO_RNG=n

# Core0 <-> core1 SIO-FIFO mailbox (see &mbox in the board overlay).
CONFIG_MBOX=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_SHELL=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y


CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_ETHERNET_MGMT=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_ARP=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_DHCPV4_OPTION_CALLBACKS=y
CONFIG_DNS_RESOLVER=y

CONFIG_TEST_RANDOM_GENERATOR=y

CONFIG_INIT_STACKS=y

CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

CONFIG_NET_TCP=y

# Per-chip unique ID (RP2350 flash unique ID), used by src/eth_id.c to
# generate a stable, per-board MAC address instead of the fixed one in the
# devicetree overlay.
CONFIG_HWINFO=y

# IEEE 1588 (PTP) hardware clock on the LAN9250 - see
# drivers/eth_lan9250/ptp_clock_lan9250.c and THEORY_OF_OPERATION.md's
# "IEEE 1588 / PTP" section. CONFIG_PTP_CLOCK_SHELL gives a generic
# `ptp_clock get/set/adjust/rate_adjust <device>` shell interface for free
# (device name is PTP_CLOCK_NAME, i.e. "PTP_CLOCK") - used instead of
# hand-writing set/adjust/rate_adjust test commands ourselves; this
# project's own `ptp clock`/`ptp pps` commands (src/ptp_shell.c) cover
# what that generic interface doesn't (free-running-rate sanity check,
# arming the 1PPS output).
CONFIG_PTP_CLOCK=y
CONFIG_PTP_CLOCK_SHELL=y

# Needed for net_pkt_timestamp()/net_pkt_set_timestamp() - phase 4 (RX/TX
# hardware packet timestamping, drivers/eth_lan9250/eth_lan9250.c's
# lan9250_1588_rx_timestamp_check()/lan9250_1588_tx_timestamp_check())
# attaches captured 1588 timestamps to net_pkt via this.
CONFIG_NET_PKT_TIMESTAMP=y

# mDNS hostname resolution ("stepperXXXX".local, XXXX = last 2 MAC bytes in
# hex - see set_unique_hostname() in src/mdns_service.c) + DNS-SD service
# advertisement. CONFIG_NET_HOSTNAME_DYNAMIC gives NET_HOSTNAME_MAX_LEN a
# default of 63 (vs. just sizeof(CONFIG_NET_HOSTNAME)-1 otherwise), which is
# what actually leaves room to append the 4 hex digits at runtime.
CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME="stepper"
CONFIG_NET_HOSTNAME_DYNAMIC=y
CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_MDNS_RESPONDER_DNS_SD=y

# Network shell (telnet), advertised via DNS-SD (src/mdns_service.c) so the
# same `stepper ...`/`net ...` commands work over the network, discoverable
# without knowing the DHCP-assigned IP. Coexists with the USB CDC-ACM shell.
CONFIG_SHELL_BACKEND_TELNET=y

# ZVFS_POLL_MAX defaults to 4 (Kconfig: "default 4 if SHELL_BACKEND_TELNET"),
# sized for telnet alone. With MDNS_RESPONDER's DNS_SOCKET_DISPATCHER also
# needing poll slots via the same shared NET_SOCKETS_SERVICE thread, 4 isn't
# enough - the thread's own "needed slots > ZVFS_POLL_MAX" startup check
# fails closed, and *both* telnet and mDNS/DNS-SD registration silently fail
# ("Socket service thread not running" in the boot log). Matches the value
# zephyr/samples/net/mdns_responder/prj.conf uses for mDNS alone (9); a bit
# of headroom on top of that covers telnet's listen+accept sockets too.
CONFIG_ZVFS_POLL_MAX=12

# Root-caused via a live comparison: the stock zephyr/samples/net/ptp
# sample converges from LISTENING to GRAND_MASTER correctly on native_sim
# using the exact same PTP library code, but on this project's real
# hardware build the PTP thread's own announce/sync k_timers fire exactly
# on schedule (confirmed via direct instrumentation) while the PTP
# thread's blocking zsock_poll(..., -1) never wakes up to process them -
# it relies entirely on a zvfs_eventfd()-based self-pipe wakeup
# (ptp_clock_signal_timeout(), clock.c), and that eventfd creation itself
# was silently failing (confirmed: "fd=-1", the call's return value isn't
# checked anywhere in the library - a fd of -1 in a pollfd entry is always
# ignored by poll() per POSIX semantics, so the thread parks forever).
# Root cause: CONFIG_ZVFS_EVENTFD_MAX defaults to just 1 - a single
# system-wide eventfd - and this project's mDNS/telnet/DNS-SD socket
# service (subsys/net/lib/sockets/sockets_service.c) already uses its own
# eventfd for the identical self-pipe-wakeup pattern, claiming the only
# available slot before PTP's own (later, APPLICATION-level) init gets a
# turn. Also bump ZVFS_OPEN_MAX: CONFIG_PTP's Kconfig doesn't declare a
# ZVFS_OPEN_ADD_SIZE_* contribution for the sockets/eventfd it creates at
# runtime, so the auto-computed sum (from every *other* subsystem's
# declared needs) has no headroom for PTP's - harmless on its own, but
# kept since it's still a real gap worth covering.
CONFIG_ZVFS_EVENTFD_MAX=4
CONFIG_ZVFS_OPEN_MAX=32

# NET_MAX_CONN defaults to 4 (IPv4-only), which is enough for DHCPv4 + DNS
# resolver alone but not once mDNS (its own UDP listener) and telnet (a TCP
# listener, plus one more per connected client) are also running
# concurrently - the connection table fills up and new TCP SYNs get
# rejected ("Not enough connection contexts. Consider increasing
# CONFIG_NET_MAX_CONN").
CONFIG_NET_MAX_CONN=10

# NET_MAX_CONTEXTS (the underlying per-socket pool NET_MAX_CONN's entries
# are backed by) defaults to 6 - same headroom reasoning as NET_MAX_CONN
# above, bumped together so this doesn't become the next thing to run out.
CONFIG_NET_MAX_CONTEXTS=10

# Default NET_PKT_RX_COUNT=14 / NET_BUF_RX_COUNT=36 (at NET_BUF_DATA_SIZE=128
# bytes each) gives only ~4.6KB of total RX buffering. This LAN is
# genuinely chatty across many multicast groups (mDNS from several devices,
# Chromecast/Google Home discovery, SSDP, etc. - drivers/eth_lan9250/'s
# MCPAS fix passes all multicast, not just our own 224.0.0.251 traffic),
# with mDNS responses commonly running 400-650+ bytes and arriving in
# bursts of several back-to-back. Combined with the LAN9250's slow 10MHz
# SPI bus (each frame needs a full synchronous SPI read before the next
# can start), the default pool can empty out under sustained bursts
# ("Could not allocate rx buffer" in the log). Kept generous here even
# after moving multicast filtering into the driver (see
# drivers/eth_lan9250/), since RAM has plenty of headroom (~21% used of
# 392KB) and it's cheap insurance against burst traffic on a busy LAN.
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=128

# mdns_responder.c keeps its own separate, dedicated buffer pool
# (mdns_msg_pool) for every packet it parses on 224.0.0.251:5353 - distinct
# from the generic net_pkt RX pool above. It defaults to just
# DNS_RESOLVER_MIN_BUF(2) + MDNS_RESOLVER_ADDITIONAL_BUF_CTR(0) = 2 buffers
# of MDNS_RESOLVER_BUF_SIZE(512) bytes each, and mdns_responder.c's
# dns_read() allocates exactly one buffer per incoming message (truncated
# to MDNS_RESOLVER_BUF_SIZE, not chained across multiple buffers) - so
# buffer count directly caps how many messages can be in flight at once.
# Since our responder has to parse *every* multicast packet it receives to
# check relevance (not just ones meant for us), a query burst - e.g.
# `avahi-browse -a -r`, which makes every other device on the LAN answer
# about every service type nearly simultaneously - exhausts a small pool
# almost instantly. Confirmed via `net stats`: the DNS drop counter spikes
# sharply during exactly this kind of burst while DNS recv only rises
# modestly, i.e. packets are arriving and being dropped specifically at
# this layer, not just the generic IP layer - even a first attempt at
# generously bumping this (14 additional, 16 total = 8KB) wasn't enough
# for a real `avahi-browse -a` burst on this LAN (still ~47 DNS drops in a
# single reproduction). Bumped much further; RAM still has plenty of
# headroom (~26% used of 392KB even after this).
CONFIG_MDNS_RESOLVER_ADDITIONAL_BUF_CTR=46

# NET_IF_MCAST_IPV4_ADDR_COUNT defaults to 2, but one slot is permanently
# reserved by net_ipv4_igmp_init() for the IGMP all-systems address
# (224.0.0.1) - leaving only 1 free for applications. mDNS's 224.0.0.251
# already took that last slot, so both of ptp_multicast_rejoin()'s
# net_ipv4_igmp_join() calls (224.0.1.129, 224.0.0.107 - see src/eth_id.c)
# failed with -ENOMEM (confirmed via console log: "Forced multicast rejoin
# of 224.0.1.129 failed (-12)"). Sized for all-systems + mDNS + both PTP
# groups, plus one spare.
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=5

CONFIG_NET_LOG=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2

CONFIG_SLIP_STATISTICS=n

CONFIG_SPI=y
CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y

# TEMPORARY: lets `net mem` report live net_buf pool occupancy, to check
# for a real leak vs transient pressure in the RX buffer pool.
CONFIG_NET_BUF_POOL_USAGE=y

# All project-added LOG_INF diagnostics in the (untracked) Zephyr PTP
# stack (subsys/net/lib/ptp/{port,clock}.c) were stripped once they'd
# answered what they were added for - BMCA/BTCA logic confirmed correct,
# RX timestamp matching confirmed 100% immediate. No CONFIG_PTP_LOG_LEVEL
# override needed anymore; it defaults to WRN.
#
# The LAN9250 driver's own module still needs one, for the reason below.
# driver's own module (LOG_MODULE_REGISTER(eth_lan9250,
# CONFIG_ETHERNET_LOG_LEVEL)) - without this, its DIAG rx_match periodic
# summary (and any other project-added LOG_INF in that file) compiles out
# entirely, the same silent-elimination gotcha already hit once this
# session. Confirmed via `strings <elf> | grep <format string>` before
# adding this - the lesson from last time was to always verify a new
# LOG_INF actually landed in the binary before trusting its absence in a
# capture, not to skip checking Kconfig log levels in the first place.
CONFIG_ETHERNET_LOG_LEVEL_INF=y

# Phase 5: IEEE 1588 PTP full network sync, built on phase 4's
# now-confirmed RX/TX hardware timestamping. Uses Zephyr's separate,
# newer CONFIG_PTP stack (subsys/net/lib/ptp/) rather than CONFIG_NET_GPTP
# (802.1AS/gPTP): gPTP mandates the peer-delay mechanism, which uses a
# reserved L2 multicast address (01-80-C2-00-00-0E) that ordinary,
# non-TSN-aware switches are specified to never forward between ports -
# confirmed on real hardware (symmetric Pdelay_Req loss through a plain
# switch, unaffected by port/cable, while direct board-to-board links
# always worked). Since this project can't require customers to use
# specialized TSN-capable switches, that made gPTP a non-starter despite
# it fully working in direct-connect testing. CONFIG_PTP defaults to the
# E2E delay mechanism over ordinary UDP/IPv4 multicast (224.0.1.129,
# the standard well-known PTP address) instead, which is genuinely
# ordinary IP traffic that any switch/router forwards normally. It
# reuses the same generic ptp_clock driver API (ptp_clock_set()/
# ptp_clock_rate_adjust()) this project's LAN9250 driver already
# implements, so the hardware bring-up work carries over - this is a
# protocol-stack substitution, not a hardware redo. depends on
# !NET_GPTP, so the two are mutually exclusive.
CONFIG_PTP=y
